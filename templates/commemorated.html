{% extends "base.html" %}
{% block nav %}<a href="/">Desk View</a> · <a href="/dashboard">Live View</a>{% endblock %}
{% block content %}

<div class="card" style="padding:12px 16px;text-align:center;">
  <div style="font-size:13px;color:#6b7280;">Commemorated persons visited</div>
  <div style="font-size:28px;font-weight:700;color:#7c3aed;" id="commemTotal">0 / 543</div>
</div>

<div class="card">
  <input id="cSearch" placeholder="Search commemorated person's name or number..." autocomplete="off"
         autofocus style="font-size:18px;padding:14px;margin-bottom:8px;" />
  <div id="cResults"></div>
</div>

<style>
  .commem-card { border:1px solid #e5e7eb; border-radius:10px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .commem-name { font-weight:600; font-size:15px; }
  .commem-sub { font-size:12.5px; color:#6b7280; margin-top:2px; }
</style>

<script>
const deskName = localStorage.getItem('flash_desk') || 'Unknown Desk';
let cDebounce;
const cSearch = document.getElementById('cSearch');
cSearch.addEventListener('input', (e) => {
  clearTimeout(cDebounce);
  const q = e.target.value.trim();
  if (q.length < 1) { document.getElementById('cResults').innerHTML = ''; return; }
  cDebounce = setTimeout(() => doSearch(q), 200);
});

async function doSearch(q) {
  const res = await fetch('/api/search_commemorated?q=' + encodeURIComponent(q));
  const data = await res.json();
  const box = document.getElementById('cResults');
  if (data.length === 0) {
    box.innerHTML = '<p style="color:#6b7280;font-size:14px;">No match found.</p>';
    return;
  }
  box.innerHTML = data.map(r => `
    <div class="commem-card">
      <div>
        <div class="commem-name">#${r.sl_no} — ${r.name}</div>
        ${r.already_checked_in ? `<div class="commem-sub">✓ Visited at ${r.checked_in_at} (${r.checked_in_desk})</div>` : `<div class="commem-sub">Not yet visited</div>`}
      </div>
      ${r.already_checked_in
        ? `<span class="badge">✓ Done</span>`
        : `<button style="width:auto;padding:10px 16px;font-size:14px;background:#7c3aed;" onclick="checkin(${r.commemorated_id}, this)">Mark Visited</button>`}
    </div>
  `).join('');
}

async function checkin(commemId, btn) {
  btn.disabled = true;
  btn.textContent = 'Marking...';
  const res = await fetch('/api/checkin_commemorated', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({commemorated_id: commemId, visitor_name: '', visitor_phone: '', desk: deskName})
  });
  const data = await res.json();
  if (data.ok) {
    showToast('Marked as visited.');
  } else if (data.already_checked_in) {
    showToast('Already marked visited.');
  } else {
    showToast('Error marking visited');
  }
  doSearch(cSearch.value.trim());
  refreshTotal();
}

async function refreshTotal() {
  const res = await fetch('/api/commemorated_stats');
  const d = await res.json();
  document.getElementById('commemTotal').textContent = `${d.checked_in} / ${d.total}`;
}
refreshTotal();
setInterval(refreshTotal, 6000);
</script>
{% endblock %}
